plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}-neoforge" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories { mavenCentral() }

// The integration driver is compiled only for an explicitly requested development run.
def smokeTest = project.hasProperty('smokeTest')
if (smokeTest) {
    sourceSets.main.java.srcDir('src/smoke/java')
    sourceSets.main.resources.srcDir('src/smoke/resources')
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file(smokeTest ? 'build/smoke-run' : 'run')
            if (smokeTest) {
                programArgument '--width=1280'
                programArgument '--height=720'
            }
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('processResources', ProcessResources) {
    def resourceVersion = project.mod_version
    inputs.property 'mod_version', resourceVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: resourceVersion
    }
}
